# CRITICAL: Memory optimization for constrained environments
# Do NOT exceed 1024m for Xmx in memory-limited containers
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=1
android.useAndroidX=true
android.enableJetifier=true

# Disable features that consume extra memory
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.workers.max=1

# Disable R8 full mode to reduce memory usage during build
android.enableR8.fullMode=false

# Enable simple build mode
org.gradle.caching=false

# Kotlin compiler optimization
kotlin.incremental=false
