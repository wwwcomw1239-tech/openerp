name: openerp_flutter
description: Open Source ERP System - Flutter Desktop & Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management - Riverpod 2.0
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Database - Drift (SQLite)
  drift: ^2.14.1
  sqlite3_flutter_libs: 0.5.17
  
  # Navigation
  go_router: ^13.1.0
  
  # UI Components
  fl_chart: ^0.66.2
  intl: ^0.19.0
  
  # PDF Export
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # Icons
  flutter_svg: ^2.0.9
  font_awesome_flutter: ^10.7.0
  
  # Form validation
  formz: ^0.7.0
  
  # Date/Time
  dart_date: ^1.3.2
  
  # Money formatting
  currency_text_input_formatter: ^2.1.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.8
  drift_dev: ^2.14.1
  riverpod_generator: ^2.3.9
  
  # Linting
  flutter_lints: ^3.0.1
  custom_lint: ^0.6.2
  riverpod_lint: ^2.3.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
